version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Vite 8 needs Node 20.19+; pin to the version in .nvmrc.
        - nvm install
        - nvm use
        - node --version
        - npm ci
    build:
      commands:
        - npm test
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
  customHeaders:
    # Vite fingerprints everything under /assets, so it can be cached forever.
    - pattern: '/assets/**'
      headers:
        - key: Cache-Control
          value: 'public, max-age=31536000, immutable'
    - pattern: '/models/**'
      headers:
        - key: Cache-Control
          value: 'public, max-age=86400'
    - pattern: '/index.html'
      headers:
        - key: Cache-Control
          value: 'no-cache'
